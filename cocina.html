<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1824"><meta name="referrer" content="no-referrer"><title>Cocina · Mistura Fish</title><link rel="stylesheet" href="/online.css?v=20261023"><script defer src="/cocina.js?v=20261023"></script></head><body><header class="public-header"><div class="brand"><img src="/assets/mistura-logo.png" alt="Mistura Fish" width="64" height="64"><span>Mistura Fish<small>COCINA · PEDIDOS</small></span></div><button id="kitchen-logout" class="ghost" hidden>Salir de cocina</button></header><main class="kitchen-main"><section id="kitchen-login" class="kitchen-login"><p class="eyebrow">ACCESO DEL EQUIPO</p><h1 style="font-size:36px">Todo listo<br>para el servicio.</h1><p class="muted">Ingresa el código de cocina que te comparte administración.</p><form id="kitchen-form"><label>Código de cocina<input name="key" type="password" autocomplete="current-password" required maxlength="100"></label><button class="primary full" type="submit">Entrar a cocina</button></form></section><p id="kitchen-notice" class="notice" role="status" aria-live="polite" hidden></p><section id="kitchen-screen" hidden><div class="section-heading"><div><p class="eyebrow">SERVICIO EN MARCHA</p><h1 style="font-size:36px">Pedidos de cocina</h1></div><span id="kitchen-updated" class="muted"></span></div><div class="kitchen-tools"><label>Fecha<input type="date" id="kitchen-date"></label><button class="ghost" id="kitchen-refresh">Actualizar pedidos</button><button class="ghost" id="kitchen-sound" aria-pressed="false">Activar sonido</button><label><input type="checkbox" id="show-delivered"> Mostrar entregados y cancelados</label></div><div id="kitchen-board" class="kitchen-board"></div></section></main><dialog id="reject-dialog"><h2>Rechazar pedido</h2><p>Indica el motivo que verá el cliente. Los pedidos pagados requieren revisión de administración.</p><form id="reject-form"><label>Motivo<textarea name="reason" maxlength="200" required></textarea></label><div class="actions"><button class="primary" type="submit">Confirmar rechazo</button><button class="ghost" id="close-reject" type="button">Volver</button></div></form></dialog></body></html>
