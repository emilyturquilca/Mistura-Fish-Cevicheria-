<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mistura Fish · Panel analítico</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="assets/xlsx.full.min.js"></script>
<script src="sales-core.js"></script>
<style>
:root{--bg:#f3f8fa;--card:#fff;--ink:#0d2b3e;--mut:#5b7686;--line:#dbe8ee;--side:#0b2a40;--sea:#0e7c9b;--tq:#19b5b0;--warm:#f08a4b;--sand:#e8f4f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1b28;--card:#10293a;--ink:#e6f2f6;--mut:#8fb0bf;--line:#1d3d52;--sand:#14344a}}
:root[data-theme=dark]{--bg:#0a1b28;--card:#10293a;--ink:#e6f2f6;--mut:#8fb0bf;--line:#1d3d52;--sand:#14344a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;min-height:100vh}
aside{width:210px;background:var(--side);color:#cfe6ee;padding:16px 10px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{font-weight:700;font-size:17px;color:#fff;padding:4px 10px 18px}.logo small{display:block;font-weight:400;color:var(--tq);font-size:11px}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:8px;cursor:pointer;font:inherit;margin-bottom:2px}
aside button:hover{background:#ffffff14}aside button.on{background:var(--sea);color:#fff}
aside button:focus-visible,.pill:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--warm);outline-offset:1px}
main{flex:1;min-width:0;padding:20px 24px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:0 0 10px}.sub{color:var(--mut);margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.pill,select,input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px;font:inherit}
.pill{cursor:pointer}.pill.on{background:var(--sea);border-color:var(--sea);color:#fff}.pill:disabled{opacity:.45;cursor:default}.date-nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.date-nav input{border-radius:8px}.notice{padding:10px 14px;background:var(--sand);border-radius:8px;margin-bottom:14px}
.btn{background:var(--warm);color:#2a1300;border:0;border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.k{color:var(--mut);font-size:12px}.v{font-size:22px;font-weight:700;margin-top:2px}.v.s{font-size:16px}
.up{color:#119a6a;font-size:12px}.dn{color:#d2452f;font-size:12px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:12px}
tr.c{cursor:pointer}tr.c:hover{background:var(--sand)}
.na{color:var(--mut);font-style:italic}.tag{background:var(--sand);color:var(--sea);border-radius:10px;padding:2px 8px;font-size:12px}
.product-name{color:var(--ink);font-weight:700}
canvas{max-height:260px}.empty{padding:24px;text-align:center;color:var(--mut)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.steps span{background:var(--sand);border-radius:16px;padding:4px 12px}.steps .on{background:var(--tq);color:#06302f;font-weight:700}
.demo{background:#fff4e8;color:#7a3d0a;border-radius:8px;padding:6px 12px;margin-bottom:14px;font-size:12px}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;height:auto;position:static;display:flex;overflow-x:auto;gap:4px;padding:8px}.logo{display:none}aside button{width:auto;white-space:nowrap}main{padding:14px}}
</style></head><body>
<aside id="nav"><div class="logo">Mistura Fish<small>Panel analítico · Loyverse</small></div></aside>
<main id="app"></main>
<script>
// ===== Datos reales (API de Loyverse vía /api/loyverse) =====
const Core=globalThis.MisturaCore;
const today=Core.dayStart(Core.dateKey());
let PAY=[],CATS=[],PROD=[],CLI=[],VENTAS=[],MSG='';
const K='mf_datos',CL='mf_clave',TK='mf_token';
let DB=JSON.parse(localStorage.getItem(K)||'{"v":{},"prods":{},"sync":null}'),syncing=false,serverConfigured=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clave=()=>sessionStorage.getItem(CL)||'';
async function api(path,params){const u=new URL('/api/loyverse',location.origin);u.searchParams.set('path',path);
 Object.entries(params||{}).forEach(([k,v])=>v&&u.searchParams.set(k,v));
 const h={'x-clave':encodeURIComponent(clave())},t=localStorage.getItem(TK);if(t&&!serverConfigured)h['x-token']=encodeURIComponent(t);
 const r=await fetch(u,{headers:h});
 if(r.status==401)throw new Error('AUTH');
 if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||'Error '+r.status)}const data=await r.json();if(path=='/ping')serverConfigured=Boolean(data.loyverseConfigured);return data}
async function pages(path,key,p){let c,all=[];do{const d=await api(path,{...p,limit:250,cursor:c});all.push(...(d[key]||[]));c=d.cursor}while(c);return all}
function hidratar(){
 PROD=Object.keys(DB.prods).map((k,i)=>({id:i,key:k,...DB.prods[k]}));const ix={};PROD.forEach(p=>ix[p.key]=p.id);
 VENTAS=Object.values(DB.v).map(v=>({...v,f:new Date(v.f),paid:v.total,total:P.metric=='paid'?v.total:(v.net??v.total),items:(v.items||[]).filter(i=>ix[i.k]!==undefined).map(i=>({p:ix[i.k],q:i.q,t:i.t}))})).sort((a,b)=>a.f-b.f);
 PAY=[...new Set(VENTAS.map(v=>v.pay))];CATS=[...new Set(PROD.map(p=>p.c))];CLI=[...new Set(VENTAS.map(v=>v.cli))]}
async function sincronizar(forzar,desde){
 if(syncing)return;
 if(!forzar&&!desde&&DB.apiVersion===3&&DB.apiSync&&Date.now()-new Date(DB.apiSync)<3e5)return;
 syncing=true;
 MSG='Sincronizando…';render();
 try{
  const[cats,items,cus]=await Promise.all([pages('/categories','categories'),pages('/items','items'),pages('/customers','customers')]);
  const cn={},cm={};cats.forEach(c=>cn[c.id]=c.name);cus.forEach(c=>cm[c.id]=c.name);
  items.forEach(it=>{const v=(it.variants||[])[0]||{};DB.prods[it.id]={n:it.item_name,c:cn[it.category_id]||'Sin categoría',p:v.default_price??0,k:v.cost>0?v.cost:null}});
  const started=new Date().toISOString();
  const createdSince=desde||new Date(Date.now()-30*864e5).toISOString();
  const since=desde||(DB.apiVersion===3&&DB.apiSync?new Date(new Date(DB.apiSync)-864e5).toISOString():createdSince);
  const receipts=await pages('/receipts','receipts',{created_at_min:createdSince,updated_at_min:since});
  const next={...DB,v:{...DB.v},prods:{...DB.prods}};
  const counts=Core.mergeReceipts(next,receipts,cm);
  next.sync=started;
  // A historical load must not advance the incremental cursor or finish a partial migration.
  if(!desde){next.apiSync=started;next.apiVersion=3}
  DB=next;MSG='';
  if(guardar())MSG=`Sincronizado: ${counts.added} recibos nuevos, ${counts.updated} actualizados y ${counts.cancelled} anulados retirados.`;
 }catch(e){if(e.message=='AUTH')return salir();MSG=/^Falta el token/.test(e.message)?(forzar||desde?'Falta conectar Loyverse: guarda el token en esta pantalla o sube un archivo de datos.':''):'No se pudo sincronizar ('+e.message+'). Mostrando datos guardados.'}
 finally{syncing=false}
 hidratar();render()}
function login(){sessionStorage.removeItem(CL);localStorage.removeItem(CL);document.getElementById('app').innerHTML='<div class="card" style="max-width:320px;margin:60px auto"><h2>Mistura Fish</h2><p><input type="password" id="clv" placeholder="Contraseña" style="width:100%" onkeydown="if(event.key==\'Enter\')entrar()"></p><button class="btn" onclick="entrar()">Entrar</button><p class="na" id="lerr"></p></div>'}
async function entrar(){sessionStorage.setItem(CL,document.getElementById('clv').value);
 try{await api('/ping');arrancar()}catch(e){sessionStorage.removeItem(CL);document.getElementById('lerr').textContent=e.message=='AUTH'?'Contraseña incorrecta':'No se pudo conectar: '+e.message}}
function salir(){sessionStorage.removeItem(CL);localStorage.removeItem(CL);login()}
function cargarHist(){const v=document.getElementById('hd').value;if(!v){MSG='Elige la fecha desde la cual cargar.';return render()}sincronizar(true,Core.dayStart(v).toISOString())}
function guardar(){try{localStorage.setItem(K,JSON.stringify(DB));return true}catch{MSG='Aviso: el almacenamiento del navegador está lleno. Usa un historial más corto.';return false}}
function guardarToken(){const t=document.getElementById('tk').value.trim();if(!t){MSG='Pega el token de Loyverse.';return render()}localStorage.setItem(TK,t);sincronizar(true)}
function quitarToken(){localStorage.removeItem(TK);MSG='Token eliminado de este dispositivo.';render()}
function csvParse(t,d){const R=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const x=t[i];
  if(q){if(x=='"'&&t[i+1]=='"'){c+='"';i++}else if(x=='"')q=false;else c+=x}
  else if(x=='"')q=true;else if(x==d){r.push(c);c=''}
  else if(x=='\n'||x=='\r'){if(c||r.length){r.push(c);R.push(r)}r=[];c='';if(x=='\r'&&t[i+1]=='\n')i++}else c+=x}
 if(c||r.length){r.push(c);R.push(r)}return R}
const fechaISO=Core.parseDate;
function importar(t){const l=t.split('\n')[0],d=(l.match(/;/g)||[]).length>(l.match(/,/g)||[]).length?';':',';
 const R=csvParse(t,d),H=R[0].map(h=>h.trim().toLowerCase().replace(/^\ufeff/,''));
 const col=ks=>{for(const k of ks){const i=H.findIndex(h=>h.includes(k));if(i>=0)return i}return -1};
 const I={id:col(['receipt number','número de recibo','numero de recibo','número de venta','recibo']),f:col(['date','fecha']),t:col(['net sales','ventas netas','total','gross sales','ventas brutas']),m:col(['payment type','payment','tipo de pago','pago']),c:col(['customer name','nombre del cliente','customer','cliente']),p:col(['item','artículo','articulo','producto']),q:col(['quantity','cantidad']),g:col(['category','categoría','categoria']),k:col(['cost of goods','coste','costo']),y:col(['receipt type','tipo de recibo'])};
 if(I.id<0||I.f<0||I.t<0){MSG='No reconocí las columnas del archivo: necesito número de recibo, fecha y total.';return render()}
 const num=v=>parseFloat(String(v??'').replace(/[^\d,.-]/g,'').replace(d==';'?/\./g:/,/g,'').replace(',','.'))||0;
 const N={};let err=0;
 R.slice(1).forEach(r=>{const id=(r[I.id]||'').trim(),f=fechaISO(r[I.f]||'');if(!id||!f){err++;return}
  if(I.y>=0&&/cancel|anulad/i.test(r[I.y])){if(DB.v[id]?.source!='api')delete DB.v[id];return}
  const sign=I.y>=0&&/refund|reembolso|devol/i.test(r[I.y])?-1:1;
  const o=N[id]||(N[id]={id,f,source:'file',type:sign<0?'REFUND':'SALE',cli:I.c>=0&&r[I.c]?r[I.c]:'Consumidor final',pay:I.m>=0&&r[I.m]?r[I.m]:'Sin dato',total:0,items:[]});
  const t=sign*Math.abs(num(r[I.t]));o.total=Core.round(o.total+t);
  if(I.p>=0&&r[I.p]){const n=r[I.p],q=I.q>=0?num(r[I.q])||1:1,kc=I.k>=0?num(r[I.k]):0;
   if(!DB.prods[n])DB.prods[n]={n,c:I.g>=0&&r[I.g]?r[I.g]:'Sin categoría',p:t/q,k:kc>0?kc/q:null};
   o.items.push({k:n,q:sign*Math.abs(q),t})}});
 let n=0;const tot=Object.keys(N).length;Object.values(N).forEach(o=>{if(!DB.v[o.id])n++;if(DB.v[o.id]?.source!='api')DB.v[o.id]=o});
 DB.sync=new Date().toISOString();MSG='';if(guardar())MSG=`Archivo importado: ${n} ventas nuevas, ${tot-n} ya existían${err?', '+err+' filas omitidas por no tener recibo o fecha válida':''}.`;
 hidratar();render()}
async function archivo(inp){const f=inp.files[0];if(!f)return;
 try{let t;if(/\.xlsx?$/i.test(f.name)){const w=XLSX.read(await f.arrayBuffer());t=XLSX.utils.sheet_to_csv(w.Sheets[w.SheetNames[0]])}else t=await f.text();importar(t)}
 catch(e){MSG='No se pudo leer el archivo: '+e.message;render()}}
function arrancar(){hidratar();if(!serverConfigured&&!localStorage.getItem(TK)&&!VENTAS.length)view='Sincronizar Loyverse';render();sincronizar(false)}
async function iniciar(){localStorage.removeItem(CL);if(!clave())return login();try{await api('/ping');arrancar()}catch(e){salir()}}
// ===== Utilidades =====
const S=x=>'S/ '+x.toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const D=d=>d.toLocaleDateString('es-PE',{timeZone:Core.TIME_ZONE,day:'2-digit',month:'short'});
const fechaCompleta=d=>d.toLocaleDateString('es-PE',{timeZone:Core.TIME_ZONE,day:'2-digit',month:'2-digit',year:'numeric'});
const horaLima=d=>d.toLocaleString('es-PE',{timeZone:Core.TIME_ZONE});
const sum=a=>Core.round(a.reduce((s,x)=>s+x,0));
function range(k){return Core.dateRange({...P,k})}
function sel(k){const interval=range(k);return VENTAS.filter(v=>Core.inRange(v,interval))}
function group(arr,keyFn,valFn){const m={};arr.forEach(x=>{const k=keyFn(x);m[k]=(m[k]||0)+valFn(x)});return m}
function lines(vs){return vs.flatMap(v=>v.items.map(i=>({...i,pr:PROD[i.p],v})))}
const P={k:'hoy',day:Core.dateKey(),metric:'net',from:Core.shiftDay(Core.dateKey(),-7),to:Core.dateKey()};
let view='Dashboard',charts=[],q='',fp='',openId=null,step=0,lastImport=null;
const MENU=['Dashboard','Ventas','Productos','Clientes','Rentabilidad','Reportes','Sincronizar Loyverse','Configuración'];
function nav(){const n=document.getElementById('nav');n.querySelectorAll('button').forEach(b=>b.remove());
 MENU.forEach(m=>{const b=document.createElement('button');b.textContent=m;b.className=m==view?'on':'';b.onclick=()=>{view=m;openId=null;render()};n.appendChild(b)})}
function elegirPeriodo(k){P.k=k;if(k=='hoy')P.day=Core.dateKey();render()}
function elegirDia(day){if(!Core.dateKey(Core.dayStart(day))||day>Core.dateKey())return;P.day=day;P.k=day==Core.dateKey()?'hoy':'dia';render()}
function moverDia(offset){elegirDia(Core.shiftDay(P.k=='hoy'?Core.dateKey():P.day,offset))}
function elegirMetrica(metric){P.metric=metric;hidratar();render()}
function period(){const actual=Core.dateKey(),day=P.k=='hoy'?actual:P.day;
 const o=[['hoy','Hoy · '+fechaCompleta(Core.dayStart(actual))],['semana','Esta semana'],['mes','Este mes'],['anterior','Mes anterior'],['custom','Personalizado']];
 return `<div class="bar">${o.map(([k,l])=>`<button class="pill ${P.k==k?'on':''}" onclick="elegirPeriodo('${k}')">${l}</button>`).join('')}</div>
 <div class="bar">${['hoy','dia'].includes(P.k)?`<div class="date-nav"><button class="pill" onclick="moverDia(-1)" aria-label="Día anterior">←</button><label>Fecha <input type="date" aria-label="Fecha de ventas" value="${day}" max="${actual}" onchange="elegirDia(this.value)"></label><button class="pill" onclick="moverDia(1)" aria-label="Día siguiente" ${day>=actual?'disabled':''}>→</button></div>`:''}
 ${P.k=='custom'?`<label>Desde <input type="date" value="${P.from}" onchange="if(this.value){P.from=this.value;render()}" aria-label="Desde"></label><label>Hasta <input type="date" value="${P.to}" onchange="if(this.value){P.to=this.value;render()}" aria-label="Hasta"></label>`:''}
 <label>Mostrar <select aria-label="Importe de ventas" onchange="elegirMetrica(this.value)"><option value="net" ${P.metric=='net'?'selected':''}>Ventas netas</option><option value="paid" ${P.metric=='paid'?'selected':''}>Total cobrado menos devoluciones</option></select></label></div>
 ${P.k=='custom'&&P.from>P.to?'<div class="notice">La fecha inicial debe ser anterior o igual a la final.</div>':''}`}
function resumen(vs){const t=Core.totals(vs);
 return `<div class="grid">${[['Ventas brutas',S(t.gross)],['Devoluciones (antes de descuentos)',S(t.refunds)],['Descuentos netos',S(t.discounts)],['Ventas netas',S(t.net)],['Total cobrado menos devoluciones',S(t.paid)],['Beneficio bruto',t.profit==null?'Información no disponible':S(t.profit)]].map(([label,value])=>`<div class="card"><div class="k">${label}</div><div class="v s">${value}</div></div>`).join('')}</div><p class="k">Ventas netas = ventas brutas − devoluciones − descuentos netos. Beneficio bruto = ventas netas − costo de productos del recibo.</p>${t.legacy?'<div class="notice">Hay recibos antiguos o de archivo sin desglose de importes. Sus totales son provisionales: sincroniza Loyverse para comparar ventas netas, impuestos y costos.</div>':''}`}
function chart(id,type,labels,data,label,extra={}){const c=document.getElementById(id);if(!c)return;
 const cols=['#0e7c9b','#19b5b0','#f08a4b','#7fc8e0','#0b2a40','#9adbd6'];
 const style=getComputedStyle(document.documentElement),ink=style.getPropertyValue('--ink').trim(),line=style.getPropertyValue('--line').trim();
 const scales=['line','bar'].includes(type)?{x:{ticks:{color:ink,font:{weight:'600'}},grid:{color:line}},y:{ticks:{color:ink,font:{weight:'600'}},grid:{color:line}}}:undefined;
 charts.push(new Chart(c,{type,data:{labels,datasets:[{label,data,backgroundColor:type=='line'?'#19b5b033':cols,borderColor:'#0e7c9b',fill:type=='line',tension:.3,borderWidth:type=='line'?2:0}]},
 options:{responsive:true,scales,plugins:{legend:{display:['doughnut'].includes(type),position:'bottom',labels:{color:ink,font:{weight:'600'}}}},...extra}}))}
const noData='<div class="empty">No hay ventas en este período. Cambia el rango de fechas o importa datos nuevos.</div>';
// ===== Vistas =====
const V={
Dashboard(){const vs=sel(P.k),mes=sel('mes');
 if(!vs.length)return period()+noData;
 const L=lines(vs),byP=group(L,x=>x.pr.n,x=>x.q),byC=group(L,x=>x.pr.c,x=>x.t),byM=group(vs,v=>v.pay,v=>1);
 const top=(o)=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0]?.[0]||'Sin datos';
 const byD=group(vs,v=>Core.dateKey(v.f),v=>v.total);
 setTimeout(()=>{chart('c1','line',Object.keys(byD).map(k=>D(Core.dayStart(k))),Object.values(byD),'Ventas S/');chart('c2','bar',Object.keys(byC),Object.values(byC),'S/');chart('c3','doughnut',Object.keys(byM),Object.values(byM),'Ventas');
  const tp=Object.entries(byP).sort((a,b)=>b[1]-a[1]).slice(0,5);chart('c4','bar',tp.map(x=>x[0]),tp.map(x=>x[1]),'Unidades',{indexAxis:'y'})});
 return `<h1>Dashboard</h1><p class="sub">Resumen del negocio con datos de Loyverse</p>${period()}
 <div class="grid">${[[P.metric=='paid'?'Total cobrado (período)':'Ventas netas (período)',S(sum(vs.map(v=>v.total)))],['Total del mes actual',S(sum(mes.map(v=>v.total)))],['Ventas / devoluciones (período)',`${vs.filter(v=>v.type!='REFUND').length} / ${vs.filter(v=>v.type=='REFUND').length}`],['Ticket promedio de ventas',S(sum(vs.filter(v=>v.type!='REFUND').map(v=>v.total))/(vs.filter(v=>v.type!='REFUND').length||1))]].map(a=>`<div class="card"><div class="k">${a[0]}</div><div class="v">${a[1]}</div></div>`).join('')}</div>
 ${resumen(vs)}<div class="grid">${[['Producto más vendido',top(byP)],['Categoría líder',top(byC)],['Método más usado',top(byM)]].map(a=>`<div class="card"><div class="k">${a[0]}</div><div class="v s">${esc(a[1])}</div></div>`).join('')}</div>
 <div class="grid g2"><div class="card"><h2>Evolución de ventas por día</h2><canvas id="c1"></canvas></div><div class="card"><h2>Ventas por categoría</h2><canvas id="c2"></canvas></div>
 <div class="card"><h2>Método de pago</h2><canvas id="c3"></canvas></div><div class="card"><h2>Productos más vendidos</h2><canvas id="c4"></canvas></div></div>`},
Ventas(){let vs=sel(P.k).filter(v=>(v.id+v.cli).toLowerCase().includes(q.toLowerCase())&&(!fp||v.pay==fp)).reverse();
 const det=openId&&VENTAS.find(v=>v.id==openId),tot=sum(vs.map(v=>v.total)),bm=group(vs,v=>v.pay,v=>v.total);
 return `<h1>Ventas</h1><p class="sub">Historial importado desde Loyverse (solo consulta)</p>${period()}
 <div class="bar"><input placeholder="Buscar venta o cliente" value="${esc(q)}" oninput="q=this.value;render(true)"><select onchange="fp=this.value;render()"><option value="">Todos los métodos</option>${PAY.map(p=>`<option ${fp==p?'selected':''}>${esc(p)}</option>`).join('')}</select><button class="btn" onclick="exportExcel(true)">Exportar Excel (.xlsx)</button></div>

function ventasExportar(filtrar){return sel(P.k).filter(v=>!filtrar||((v.id+v.cli).toLowerCase().includes(q.toLowerCase())&&(!fp||v.pay==fp)))}
function nombreReporte(extension){const[s,e]=range(P.k);return `ventas-${Core.dateKey(s)}-a-${Core.dateKey(new Date(e-1))}.${extension}`}
function exportExcel(filtrar=false){
 try{
  if(typeof XLSX=='undefined')throw new Error('No se pudo cargar Excel. Revisa la conexión o descarga CSV desde Reportes.');
  const vs=ventasExportar(filtrar);if(!vs.length)throw new Error('No hay recibos para exportar en este filtro.');
  const t=Core.totals(vs),[s,e]=range(P.k),wb=XLSX.utils.book_new();
  const summary=[['Mistura Fish · Reporte de ventas'],['Desde',fechaCompleta(s)],['Hasta',fechaCompleta(new Date(e-1))],['Hora local','UTC-05:00'],['Importe elegido',P.metric=='paid'?'Total cobrado menos devoluciones':'Ventas netas'],['Búsqueda',filtrar?q:''],['Método',filtrar?fp||'Todos':'Todos'],[],['Concepto','Importe S/'],['Ventas brutas',t.gross],['Devoluciones antes de descuentos',t.refunds],['Descuentos netos',t.discounts],['Ventas netas',t.legacy?null:t.net],['Total cobrado menos devoluciones',t.paid],['Costo de productos',t.profit==null?null:t.cost],['Beneficio bruto',t.profit],['Ventas',t.sales],['Devoluciones',t.returns],['Recibos sin desglose',t.legacy],['Nota',t.legacy?'Importes provisionales: sincronizar Loyverse.':'Beneficio bruto no descuenta gastos operativos. Celdas vacías: información no disponible.']];
  const daily=[['Fecha','Recibos',P.metric=='paid'?'Total cobrado S/':'Ventas netas S/']];
  const days=group(vs,v=>Core.dateKey(v.f),v=>v.total),counts=group(vs,v=>Core.dateKey(v.f),()=>1);
  Object.keys(days).sort().forEach(day=>daily.push([day,counts[day],Core.round(days[day])]));
  daily.push(['TOTAL',vs.length,sum(vs.map(v=>v.total))]);
  for(const[name,rows,widths,moneyFrom]of [['Resumen',summary,[38,65],1],['Por día',daily,[18,12,24],2],['Recibos',Core.reportRows(vs),[18,26,16,30,24,...Array(9).fill(22)],5]]){

   if(name!='Resumen')sheet['!autofilter']={ref:XLSX.utils.encode_range({r:0,c:0},{r:rows.length-2,c:rows[0].length-1})};
   XLSX.utils.book_append_sheet(wb,sheet,name);
  }
  XLSX.writeFile(wb,nombreReporte('xlsx'),{compression:true});
 }catch(e){MSG=e.message;render()}
}
